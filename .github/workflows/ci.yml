name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Report MoonBit version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Test wasm
        run: moon test --deny-warn

      - name: Test native
        run: moon test --target native --deny-warn

      - name: Build native CLI
        run: moon build --target native --deny-warn

      - name: Check generated interface
        run: |
          moon info
          git diff --exit-code -- '**/pkg.generated.mbti'
