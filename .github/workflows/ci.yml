name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Report MoonBit version
        run: moon version --all

      - name: Require moonc 0.10.16+
        run: |
          version=$(moonc -v | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "moonc $version"
          if [ "$(printf '%s\n' '0.10.16' "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "MoonBit 0.10.16 or newer is required" >&2
            exit 1
          fi

      - name: Update package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Test wasm
        run: moon test --deny-warn

      - name: Test native
        run: moon test --target native --deny-warn

      - name: Build native CLI
        run: moon build --target native --deny-warn

      - name: Check generated interface
        run: |
          moon info
          git diff --exit-code -- '**/pkg.generated.mbti'
